name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # zizmor: ignore[cache-poisoning]
        with:
          cache: true
          install: false

      - name: Setup tools
        run: mise run setup

      - name: Check code
        run: mise run lint

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  preview:
    runs-on: ubuntu-24.04
    needs:
      - lint
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # zizmor: ignore[cache-poisoning]
        with:
          cache: true
          install: false

      - name: Setup tools
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        run: mise run setup --pass-cli-login

      - name: Load secrets from fnox
        run: |
          SECRETS_JSON="$(fnox export --all --format json)"
          export SECRETS_JSON
          node -e '
            const data = JSON.parse(process.env.SECRETS_JSON);
            const secrets = data.secrets || {};
            const fs = require("fs");
            for (const [k, v] of Object.entries(secrets)) {
              if (v) {
                console.log("::add-mask::" + v);
                const delimiter = "EOF_" + Date.now() + "_" + Math.random();
                fs.appendFileSync(process.env.GITHUB_ENV, k + "<<" + delimiter + "\n" + v + "\n" + delimiter + "\n");
                if (k === "PRIVATE_CONFIG") {
                  try {
                    const priv = JSON.parse(v);
                    for (const repo of priv.repositories || []) {
                      if (repo.name) console.log("::add-mask::" + repo.name);
                    }
                  } catch {}
                }
              }
            }
          '

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app_token
        with:
          client-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          permission-administration: write
          permission-contents: write
          permission-pull-requests: write

      - name: Decrypt private configuration
        run: |
          if [ -f data.private.json.enc ] && [ -n "${IAC_ENCRYPTION_KEY:-}" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -in data.private.json.enc -out data.private.json -pass env:IAC_ENCRYPTION_KEY
            node -e '
              const fs = require("fs");
              if (fs.existsSync("data.private.json")) {
                try {
                  const priv = JSON.parse(fs.readFileSync("data.private.json", "utf8"));
                  for (const repo of priv.repositories || []) {
                    if (repo.name) console.log("::add-mask::" + repo.name);
                  }
                } catch {}
              }
            '
          fi

      - name: Pulumi Preview
        id: preview
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}
        run: pulumi preview --stack prod --color=never | tee preview.log

      - name: Post or update PR comment
        if: always() && steps.preview.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const fs = require('fs');
            let log = 'No preview output recorded.';
            if (fs.existsSync('preview.log')) {
              log = fs.readFileSync('preview.log', 'utf8').trim();
              if (log.length > 60000) {
                log = log.slice(0, 60000) + '\n\n... (truncated preview output)';
              }
            }
            const status = '${{ steps.preview.outcome }}' === 'success' ? '✅ Succeeded' : '❌ Failed';
            const marker = '<!-- pulumi-preview-comment -->';
            const body = `${marker}\n### Pulumi Preview: ${status}\n\n<details><summary>Click to expand preview details</summary>\n\n\`\`\`\n${log}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request?.number || context.issue?.number;
            if (!issue_number) {
              core.info('No pull request context found for commenting.');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  ci-gate:
    runs-on: ubuntu-24.04
    needs:
      - lint
      - preview
    if: always()
    steps:
      - name: Evaluate status
        run: |
          lint_status="${{ needs.lint.result }}"
          preview_status="${{ needs.preview.result }}"
          if [ "$lint_status" = "success" ] && { [ "$preview_status" = "success" ] || [ "$preview_status" = "skipped" ]; }; then
            echo "CI passed."
            exit 0
          fi
          if [ "$lint_status" = "skipped" ] && [ "$preview_status" = "skipped" ]; then
            echo "CI skipped."
            exit 0
          fi
          echo "CI failed: lint=$lint_status, preview=$preview_status"
          exit 1
