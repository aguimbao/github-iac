name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      MISE_SCOPE: 'ci-lint'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # zizmor: ignore[cache-poisoning]
        with:
          cache: true
          install: false

      - name: Setup tools
        run: mise install

      - name: Check code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run lint

      - name: Verify clean worktree
        run: git diff --exit-code

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  pulumi-preview:
    runs-on: ubuntu-24.04
    needs:
      - lint
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/')
    permissions:
      contents: read
      pull-requests: write
    env:
      MISE_SCOPE: 'ci-pulumi-preview'
      PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # zizmor: ignore[cache-poisoning]
        with:
          cache: true
          install: false

      - name: Setup tools
        run: mise install && mise run setup-pass-cli

      - name: Install dependencies
        run: bun install

      - name: Load secrets from fnox
        run: |
          SECRETS_JSON="$(fnox export --all --format json)"
          export SECRETS_JSON
          node -e '
            const data = JSON.parse(process.env.SECRETS_JSON);
            const secrets = data.secrets || {};
            const fs = require("fs");
            for (const [k, v] of Object.entries(secrets)) {
              if (v) {
                console.log("::add-mask::" + v);
                const delimiter = "EOF_" + Date.now() + "_" + Math.random();
                fs.appendFileSync(process.env.GITHUB_ENV, k + "<<" + delimiter + "\n" + v + "\n" + delimiter + "\n");
                if (k === "PRIVATE_CONFIG") {
                  try {
                    const priv = JSON.parse(v);
                    for (const repo of priv.repositories || []) {
                      if (repo.name) console.log("::add-mask::" + repo.name);
                    }
                  } catch {}
                }
              }
            }
          '

      - name: Decrypt private configuration
        run: |
          if [ -f data.private.json.enc ] && [ -n "${IAC_ENCRYPTION_KEY:-}" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -in data.private.json.enc -out data.private.json -pass env:IAC_ENCRYPTION_KEY
            node -e '
              const fs = require("fs");
              if (fs.existsSync("data.private.json")) {
                try {
                  const priv = JSON.parse(fs.readFileSync("data.private.json", "utf8"));
                  for (const repo of priv.repositories || []) {
                    if (repo.name) console.log("::add-mask::" + repo.name);
                  }
                } catch {}
              }
            '
          fi

      - name: Pulumi Preview
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: preview
          stack-name: prod
          comment-on-pr: true
          comment-on-summary: true
          github-token: ${{ env.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}

  ci-gate:
    runs-on: ubuntu-24.04
    needs:
      - lint
      - pulumi-preview
    if: always()
    steps:
      - name: Evaluate status
        run: |
          lint_status="${{ needs.lint.result }}"
          preview_status="${{ needs.pulumi-preview.result }}"
          if [ "$lint_status" = "success" ] && { [ "$preview_status" = "success" ] || [ "$preview_status" = "skipped" ]; }; then
            echo "CI passed."
            exit 0
          fi
          if [ "$lint_status" = "skipped" ] && [ "$preview_status" = "skipped" ]; then
            echo "CI skipped."
            exit 0
          fi
          echo "CI failed: lint=$lint_status, preview=$preview_status"
          exit 1
