name: pulumi-apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-iac-pulumi-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MISE_SCOPE: 'ci-lint'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # zizmor: ignore[cache-poisoning]
        with:
          cache: true
          install: false

      - name: Setup tools
        run: mise install

      - name: Check code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run lint

      - name: Verify clean worktree
        run: git diff --exit-code

  pulumi-preview:
    runs-on: ubuntu-24.04
    needs:
      - lint
    permissions:
      contents: read
    env:
      MISE_SCOPE: 'ci-pulumi-preview'
      PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # zizmor: ignore[cache-poisoning]
        with:
          cache: true
          install: false

      - name: Setup tools
        run: mise install && mise run setup-pass-cli

      - name: Load secrets from fnox
        run: |
          SECRETS_JSON="$(fnox export --all --format json)"
          export SECRETS_JSON
          node -e '
            const data = JSON.parse(process.env.SECRETS_JSON);
            const secrets = data.secrets || {};
            const fs = require("fs");
            for (const [k, v] of Object.entries(secrets)) {
              if (v) {
                console.log("::add-mask::" + v);
                const delimiter = "EOF_" + Date.now() + "_" + Math.random();
                fs.appendFileSync(process.env.GITHUB_ENV, k + "<<" + delimiter + "\n" + v + "\n" + delimiter + "\n");
                if (k === "PRIVATE_CONFIG") {
                  try {
                    const priv = JSON.parse(v);
                    for (const repo of priv.repositories || []) {
                      if (repo.name) console.log("::add-mask::" + repo.name);
                    }
                  } catch {}
                }
              }
            }
          '

      - name: Decrypt private configuration
        run: |
          if [ -f data.private.json.enc ] && [ -n "${IAC_ENCRYPTION_KEY:-}" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -in data.private.json.enc -out data.private.json -pass env:IAC_ENCRYPTION_KEY
            node -e '
              const fs = require("fs");
              if (fs.existsSync("data.private.json")) {
                try {
                  const priv = JSON.parse(fs.readFileSync("data.private.json", "utf8"));
                  for (const repo of priv.repositories || []) {
                    if (repo.name) console.log("::add-mask::" + repo.name);
                  }
                } catch {}
              }
            '
          fi

      - name: Pulumi Preview
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: preview
          stack-name: prod
          comment-on-summary: true
          github-token: ${{ env.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}

  pulumi-apply:
    runs-on: ubuntu-24.04
    needs:
      - pulumi-preview
    environment: production
    permissions:
      contents: read
    env:
      MISE_SCOPE: 'ci-pulumi-apply'
      PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # zizmor: ignore[cache-poisoning]
        with:
          cache: true
          install: false

      - name: Setup tools
        run: mise install && mise run setup-pass-cli

      - name: Load secrets from fnox
        run: |
          SECRETS_JSON="$(fnox export --all --format json)"
          export SECRETS_JSON
          node -e '
            const data = JSON.parse(process.env.SECRETS_JSON);
            const secrets = data.secrets || {};
            const fs = require("fs");
            for (const [k, v] of Object.entries(secrets)) {
              if (v) {
                console.log("::add-mask::" + v);
                const delimiter = "EOF_" + Date.now() + "_" + Math.random();
                fs.appendFileSync(process.env.GITHUB_ENV, k + "<<" + delimiter + "\n" + v + "\n" + delimiter + "\n");
                if (k === "PRIVATE_CONFIG") {
                  try {
                    const priv = JSON.parse(v);
                    for (const repo of priv.repositories || []) {
                      if (repo.name) console.log("::add-mask::" + repo.name);
                    }
                  } catch {}
                }
              }
            }
          '

      - name: Decrypt private configuration
        run: |
          if [ -f data.private.json.enc ] && [ -n "${IAC_ENCRYPTION_KEY:-}" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -in data.private.json.enc -out data.private.json -pass env:IAC_ENCRYPTION_KEY
            node -e '
              const fs = require("fs");
              if (fs.existsSync("data.private.json")) {
                try {
                  const priv = JSON.parse(fs.readFileSync("data.private.json", "utf8"));
                  for (const repo of priv.repositories || []) {
                    if (repo.name) console.log("::add-mask::" + repo.name);
                  }
                } catch {}
              }
            '
          fi

      - name: Pulumi Apply
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: prod
          comment-on-summary: true
          github-token: ${{ env.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}
