name: apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-iac-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # zizmor: ignore[cache-poisoning]
        with:
          cache: true
          install: false

      - name: Setup tools
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        run: mise run setup --pass-cli-login

      - name: Load secrets from fnox
        run: |
          SECRETS_JSON="$(fnox export --all --format json)"
          export SECRETS_JSON
          node -e '
            const data = JSON.parse(process.env.SECRETS_JSON);
            const secrets = data.secrets || {};
            const fs = require("fs");
            for (const [k, v] of Object.entries(secrets)) {
              if (v) {
                console.log("::add-mask::" + v);
                const delimiter = "EOF_" + Date.now() + "_" + Math.random();
                fs.appendFileSync(process.env.GITHUB_ENV, k + "<<" + delimiter + "\n" + v + "\n" + delimiter + "\n");
              }
            }
          '

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app_token
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          permission-administration: write
          permission-contents: write
          permission-pull-requests: write

      - name: Pulumi Up
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}
        run: pulumi up --yes
