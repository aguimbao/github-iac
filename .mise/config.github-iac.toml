[tools]
'aqua:pulumi/pulumi' = '3.262.0'

[env]
FNOX_PROFILE = '{% if env.FNOX_PROFILE %}{{ env.FNOX_PROFILE }},{% endif %}github-iac'

[tasks.pulumi]
description = 'Run a stack-scoped Pulumi command with decrypted data and secrets'
depends = ['decrypt']
usage = '''
flag "-s --stack <stack>" help="Pulumi stack to operate on" required=#true
arg "<command>" help="Pulumi subcommand, e.g. preview"
arg "[args]" var=#true help="Extra arguments for the subcommand, e.g. --diff"
'''
run = 'fnox exec -P github-iac -- pulumi ${usage_command?} ${usage_args:-} --stack "${usage_stack?}"'

[tasks.encrypt]
description = 'Encrypt data.private.json into data.private.json.enc using Proton Pass key'
run = 'fnox exec -P github-iac -- openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -in data.private.json -out data.private.json.enc -pass env:IAC_ENCRYPTION_KEY'

[tasks.decrypt]
description = 'Decrypt data.private.json.enc into data.private.json using Proton Pass key'
shell = 'nu -c'
run = '''
if ("data.private.json.enc" | path exists) {
  fnox exec -P github-iac -- openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -in data.private.json.enc -out data.private.json -pass env:IAC_ENCRYPTION_KEY
}
'''
